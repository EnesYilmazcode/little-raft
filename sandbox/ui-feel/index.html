<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Feel Sandbox</title>
<link rel="stylesheet" href="ui-feel.css">
</head>
<body>
<canvas id="world"></canvas>

<div id="hud">
  <section class="panel nine" id="panelA" aria-label="9-slice panel">
    <h3>A. border-image 9-slice</h3>
    <p>One SVG data URI, sliced 16px. Resize freely, corners stay crisp.</p>
  </section>

  <section class="panel layered" id="panelB" aria-label="Layered CSS panel">
    <h3>B. Layered CSS frame</h3>
    <p>Gradients + inset shadows + one pseudo element. No image at all.</p>
  </section>

  <ol id="feed" aria-live="polite"></ol>

  <div id="hotbar" role="toolbar" aria-label="Hotbar">
    <i id="hbCursor" aria-hidden="true"></i>
  </div>

  <pre id="stats"></pre>
</div>

<script type="module" src="ui-feel.js"></script>
</body>
</html>
