<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Feel Sandbox</title>
<link rel="icon" href="data:,">
<!-- The real game stylesheets, so the feel layer is judged against the shipped cascade. -->
<link rel="stylesheet" href="../../dist/style.css">
<link rel="stylesheet" href="../../dist/graphics.css">
<link rel="stylesheet" href="../../dist/prompts.css">
<style>
  /* bg.jpg: a static frame captured from dist/ in headless Chrome (HUD hidden). */
  #world{background:#cfd6c8 url(bg.jpg) center/cover no-repeat}
  /* The key prompt is dist/prompts.js's #lrPrompt (styled by dist/prompts.css); the mock only fills it. */
  /* sandbox-only key legend */
  #legend{position:fixed;right:12px;top:12px;padding:6px 9px;border-radius:4px;background:#24170cc0;color:#e9dcbf;
    font:500 11px/1.5 'Segoe UI',system-ui,sans-serif;pointer-events:none;z-index:9}
  #legend kbd{font:700 10px/1 'Segoe UI',sans-serif;color:#ffe3a6;margin-right:3px}
  body.shot #legend{display:none}
</style>
</head>
<body class="playing locked first-person pointer-locked">
<div id="world" style="position:fixed;inset:0"></div>
<div id="crosshair" aria-hidden="true"><i></i></div>
<div id="pickupFeed" role="status" aria-live="polite"></div>
<div id="hud"><div class="bottom"><div class="tools" role="toolbar" aria-label="Tools"></div></div></div>
<div id="lrPrompt" aria-hidden="true"></div>
<div class="uf-stats" id="stats"></div>
<div id="legend">
  <kbd>1-8</kbd>/<kbd>wheel</kbd> select &nbsp; <kbd>E</kbd> pick up &nbsp; <kbd>B</kbd> barrel<br>
  <kbd>hold click</kbd> charge &nbsp; <kbd>F</kbd> hover &nbsp; <kbd>X</kbd> deny<br>
  <kbd>H</kbd> hurt &nbsp; <kbd>J</kbd> heal &nbsp; <kbd>K</kbd> hunger &nbsp; <kbd>Tab</kbd> inventory &nbsp; <kbd>M</kbd> reduce motion<br>
  <a href="?toasts=1" style="color:#ffe3a6;pointer-events:auto">?toasts=1</a> ui-feel's own toast stack instead of the game's pickup feed
</div>
<script type="module" src="mock.js"></script>
</body>
</html>
