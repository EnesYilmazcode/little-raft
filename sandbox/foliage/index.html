<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foliage Sandbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fd3e8; overflow: hidden; font: 13px system-ui, sans-serif; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(255,255,255,.85); padding: 10px 12px; border-radius: 8px; line-height: 1.7; }
  #hud input { width: 160px; vertical-align: middle; }
  #stats { font-family: ui-monospace, monospace; color: #234; }
</style>
</head>
<body>
<div id="hud">
  <div>wind <input id="wind" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div>grow <input id="grow" type="range" min="0" max="1" step="0.01" value="1"> <label><input id="cycle" type="checkbox" checked> cycle</label></div>
  <div id="stats"></div>
</div>
<script type="module">
import * as T from '../../dist/vendor/three.module.js';
import { windUniforms, foliageMaterial, foliageDepth, frondTexture, palmGeometry } from './foliage.js';

const q = new URLSearchParams(location.search);
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.Fog(0x9fd3e8, 18, 45);
const camera = new T.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.1, 6.2);
camera.lookAt(0, 1.3, 0);
scene.add(new T.HemisphereLight(0xdff3ff, 0x6b5a3a, 1.4));
const sun = new T.DirectionalLight(0xfff1d6, 2.4);
sun.position.set(4, 8, 3); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);
const deck = new T.Mesh(new T.CircleGeometry(14, 48), new T.MeshStandardMaterial({ color: 0xc9a46a, roughness: 1 }));
deck.rotation.x = -Math.PI / 2; deck.receiveShadow = true; scene.add(deck);

const { trunk, fronds } = palmGeometry();
const tex = frondTexture();
const leafMat = () => foliageMaterial(new T.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: T.DoubleSide, roughness: 0.8 }));
const barkMat = () => foliageMaterial(new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));

// three hero palms at different growth stages
const heroes = [];
[[-2.4, 0.35], [0, 0.7], [2.4, 1]].forEach(([x, g]) => {
  const grp = new T.Group(); grp.position.x = x; grp.rotation.y = x * 0.6;
  const lm = leafMat(), bm = barkMat();
  const f = new T.Mesh(fronds, lm), t = new T.Mesh(trunk, bm);
  f.customDepthMaterial = foliageDepth(lm); t.customDepthMaterial = foliageDepth(bm);
  for (const m of [f, t]) { m.castShadow = true; m.receiveShadow = true; grp.add(m); }
  scene.add(grp); heroes.push({ grp, lm, bm, base: g });
});

// instanced background field: one draw call per part, per-instance growth attribute
const N = +(q.get('n') || 120);
const iFr = fronds.clone(), iTr = trunk.clone();
const ig = new Float32Array(N);
for (let i = 0; i < N; i++) ig[i] = 0.3 + 0.7 * ((i * 0.618) % 1);
iFr.setAttribute('aInstGrow', new T.InstancedBufferAttribute(ig, 1));
iTr.setAttribute('aInstGrow', new T.InstancedBufferAttribute(ig, 1));
const iLeaf = foliageMaterial(new T.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: T.DoubleSide, roughness: 0.8 }), { instancedGrow: true });
const iBark = foliageMaterial(new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }), { instancedGrow: true });
const field = [new T.InstancedMesh(iFr, iLeaf, N), new T.InstancedMesh(iTr, iBark, N)];
const m4 = new T.Matrix4(), qt = new T.Quaternion(), s3 = new T.Vector3(), p3 = new T.Vector3();
for (let i = 0; i < N; i++) {
  const a = i * 2.39996, r = 7 + (i % 17) * 0.45;
  p3.set(Math.cos(a) * r, 0, -Math.abs(Math.sin(a)) * r - 2);
  qt.setFromAxisAngle(new T.Vector3(0, 1, 0), a * 3);
  s3.setScalar(0.6 + 0.4 * ig[i]);
  field.forEach(m => m.setMatrixAt(i, m4.compose(p3, qt, s3)));
}
field.forEach(m => scene.add(m));

const $ = id => document.getElementById(id);
const clock = new T.Clock();
let frames = 0, acc = 0, fps = 0;
const fixedT = q.has('t') ? +q.get('t') : null;
function frame() {
  const dt = clock.getDelta(), t = fixedT ?? clock.elapsedTime;
  windUniforms.uTime.value = t;
  windUniforms.uWindStrength.value = +$('wind').value;
  const a = 0.3 + 0.25 * Math.sin(t * 0.05); // wind direction drifts slowly
  windUniforms.uWindDir.value.set(Math.cos(a), Math.sin(a));
  for (const h of heroes) {
    let g = $('cycle').checked ? Math.min(1, ((t * 0.08 + h.base) % 1.3)) : +$('grow').value * h.base;
    if (fixedT !== null) g = h.base;
    h.lm.userData.uGrow.value = h.bm.userData.uGrow.value = g;
    h.grp.scale.setScalar(0.45 + 0.55 * g); // trunk height grows on the CPU (one uniform per object)
  }
  renderer.render(scene, camera);
  frames++; acc += dt;
  if (acc > 0.5) { fps = frames / acc; frames = 0; acc = 0; }
  const ri = renderer.info.render;
  $('stats').textContent = `${fps.toFixed(0)} fps  ${ri.calls} calls  ${(ri.triangles / 1000).toFixed(1)}k tris  ${renderer.info.programs.length} programs`;
  window.__stats = { fps, calls: ri.calls, tris: ri.triangles, programs: renderer.info.programs.length };
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
